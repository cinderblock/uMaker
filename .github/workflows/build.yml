name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  avr-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-avr avr-libc binutils-avr make

      - name: Toolchain versions
        run: |
          avr-gcc --version | head -1
          avr-g++ --version | head -1
          make --version | head -1

      - name: Build the AVR smoke test
        working-directory: tests/avr-min
        run: make build

      - name: Size report
        working-directory: tests/avr-min
        run: make size

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: avr-min-elf
          path: tests/avr-min/out/avr-min.elf
          if-no-files-found: error
